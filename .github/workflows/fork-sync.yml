# Personal fork only (sidewinderzz/solidcraft), never for upstream.
#
# Rebuilds the fork-build branch from scratch: upstream SolidCraft's main
# (tangency-labs/solidcraft), plus the fork-setup branch (these workflows and the fork's update
# settings), plus every branch listed in .github/fork-build-branches.txt on fork-setup.
# When the result differs from fork-build, it replaces fork-build, and that push starts
# "Fork build". fork-build is only ever made this way, so feature branches may be rebased
# freely; change fork-setup or the feature branches, never fork-build itself.
#
# When a branch conflicts with the newest upstream main, the build falls back to the newest
# upstream commit that every branch already contains (with a warning naming the branch to
# rebase). Only when that fails too does the run stop and fail (GitHub emails a failed run),
# leaving fork-build as it was.
#
# Needs the SYNC_TOKEN secret: a fine-grained token for this repository only, with Contents and
# Workflows read and write. GITHUB_TOKEN can't do this job: GitHub refuses its pushes when
# upstream changed a workflow file, and its pushes never start other workflows.
name: Fork sync

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check the token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::The SYNC_TOKEN secret is missing (see the comment at the top of this workflow)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fork-setup
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Rebuild fork-build
        run: |
          git config user.name "fork-build sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tangency-labs/solidcraft.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin fork-setup
          git show origin/fork-setup:.github/fork-build-branches.txt >"$RUNNER_TEMP/branches.txt"

          branches=()
          while read -r branch; do
            case "$branch" in ''|'#'*) continue ;; esac
            git fetch --no-tags origin "$branch"
            branches+=("$branch")
          done <"$RUNNER_TEMP/branches.txt"

          # Upstream main, then fork-setup, then each branch. Returns 1 on the first conflict.
          rebuild() { # <base> <label>
            git checkout -q -f -B next "$1"
            echo "- $2: $(git rev-parse --short=9 HEAD)" >>"$GITHUB_STEP_SUMMARY"
            local ref label sha files
            for label in fork-setup "${branches[@]}"; do
              ref="origin/$label"
              sha=$(git rev-parse --short=9 "$ref")
              if git merge --no-edit -m "Merge $label ($sha)" "$ref"; then
                echo "  - $label: $sha" >>"$GITHUB_STEP_SUMMARY"
              else
                files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
                echo "  - **$label ($sha): conflict** in $files" >>"$GITHUB_STEP_SUMMARY"
                echo "::warning::$label conflicts with $2 in: $files"
                git merge --abort
                return 1
              fi
            done
          }

          echo "### Sync" >>"$GITHUB_STEP_SUMMARY"
          if ! rebuild upstream/main "upstream main"; then
            # A branch doesn't merge with the newest upstream yet: build on the newest upstream
            # commit every branch already contains instead, so the build keeps every branch.
            base=$(git merge-base --octopus upstream/main origin/fork-setup "${branches[@]/#/origin/}")
            echo "Falling back to the upstream commit every branch is based on:" >>"$GITHUB_STEP_SUMMARY"
            if ! rebuild "$base" "upstream main at $(git rev-parse --short=9 "$base")"; then
              echo "::error::The branches conflict with each other or with upstream; nothing was pushed."
              exit 1
            fi
            echo "::warning::Built on an older upstream commit; rebase the conflicting branch onto upstream main to catch up."
          fi

          if git fetch --no-tags origin fork-build 2>/dev/null &&
             [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/fork-build^{tree}')" ]; then
            echo "Nothing new: no build." >>"$GITHUB_STEP_SUMMARY"
          else
            git push --force origin HEAD:fork-build
            echo "Pushed $(git rev-parse --short=9 HEAD) to fork-build: Fork build starts from this push." >>"$GITHUB_STEP_SUMMARY"
          fi
